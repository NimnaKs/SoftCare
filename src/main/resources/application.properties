spring.application.name=water-management

# DATA SOURCE (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/softCare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=admin
spring.datasource.password=1qaz2wsx

# HIKARI CONNECTION POOL (PRODUCTION STANDARD)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=2000
spring.datasource.hikari.pool-name=SoftCareHikariPool

# JPA / HIBERNATE (BEST PRACTICES)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Batch insert performance (important for big systems)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway migration support for the existing schema
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Avoid n+1 issues
spring.jpa.open-in-view=false

# LOGGING (INDUSTRY STANDARD)H
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.yourcompany.softcare=DEBUG

