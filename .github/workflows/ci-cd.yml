name: CI/CD

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  deploy:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: Select jar
        run: |
          JAR_PATH=$(ls dist/*.jar | grep -v 'original' | head -n 1)
          echo "JAR_PATH=${JAR_PATH}" >> $GITHUB_ENV
          echo "JAR_NAME=$(basename ${JAR_PATH})" >> $GITHUB_ENV

      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: ${{ env.JAR_PATH }}
          target: /tmp

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            sudo mkdir -p ${{ secrets.EC2_APP_DIR }}
            sudo mv /tmp/${{ env.JAR_NAME }} ${{ secrets.EC2_APP_DIR }}/${{ env.JAR_NAME }}
            sudo systemctl restart ${{ secrets.EC2_SERVICE_NAME }}
